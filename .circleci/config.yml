# Dummy CircleCI SETUP pipeline for the release-pipeline sandbox loop.
#
# This is a dynamic-config *setup* pipeline. It mirrors the real e2e project's
# shape so the sandbox reproduces the exact multi-workflow situation production
# has: a setup-stage workflow (`passthrough`) that continues into a *named*
# suite workflow (see continue_config.yml). BOTH workflows complete and BOTH
# emit CircleCI's native workflow-completed webhook for the same pipeline —
# carrying the same CALLBACK_* params. The release automation must therefore
# dispatch the GA exactly ONCE: it ignores the `passthrough` setup workflow by
# name (github-listener .../handler/circleci setupWorkflowNames) and acts only
# on the named suite workflow's completion. This config exists to exercise that
# dedup end-to-end in the sandbox.
#
# Triggered via API by trigger-circleci-e2e.yaml after a pre-release is
# published, passing the CALLBACK_* pipeline parameters below.
#
# Requires "Dynamic config using setup workflows" enabled in Project Settings →
# Advanced. Without it this runs as a normal config and the continuation never
# fires.
version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@1.0.0

parameters:
  # Set by trigger-circleci-e2e.yaml's API trigger. Declared here (the config
  # actually triggered) AND mirrored in continue_config.yml so they propagate
  # through the continuation. Empty defaults let the pipeline be re-run manually
  # without accidentally firing a callback.
  CALLBACK_PRODUCT_REPO:
    type: string
    default: ""
  CALLBACK_RC_TAG:
    type: string
    default: ""

jobs:
  passthrough:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      # The API-supplied pipeline parameters already propagate into the
      # continuation automatically. Passing a `parameters:` block here would be
      # rejected with "Conflicting pipeline parameters." — so there isn't one.
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml

workflows:
  # Setup-stage workflow. Named `passthrough` to mirror the real e2e project's
  # setup workflow — the release automation skips this name, so its
  # workflow-completed webhook does NOT trigger a (duplicate) GA. Only the
  # continuation's named suite workflow drives GA.
  passthrough:
    jobs:
      # tags are opt-in: circleci runs no workflow for a tag-triggered pipeline
      # unless the jobs carry tag filters, which otherwise shows up as a
      # pipeline stuck at "created" with no workflow.
      - passthrough:
          filters:
            tags:
              only: /^v.*/
