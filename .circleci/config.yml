# Dummy CircleCI pipeline for the release-pipeline sandbox loop.
#
# Reproduces the exact situation that caused the k8s-inventory double GA
# dispatch: one pipeline that completes TWO workflows — a setup-stage workflow
# named `passthrough` and a named suite workflow (`fake-e2e`) — each firing
# CircleCI's native workflow-completed webhook carrying the same CALLBACK_*
# params. The release automation must dispatch GA exactly ONCE: it ignores the
# `passthrough` name (github-listener .../handler/circleci setupWorkflowNames)
# and acts only on the named suite workflow.
#
# Why two plain workflows in ONE static config instead of a real
# setup+continuation split: the automation keys purely off the workflow NAME in
# the webhook, so two same-pipeline workflows named `passthrough` and `fake-e2e`
# are indistinguishable from the real dynamic-config setup — and this needs no
# checkout SSH key, no continuation orb, and no "Dynamic config using setup
# workflows" project toggle. (The real e2e project gets its two workflows from
# dynamic config; the sandbox just declares them directly.) Note: neither job
# runs `checkout` — the sandbox project has no checkout key, and nothing here
# needs the repo contents.
#
# Triggered via API by trigger-circleci-e2e.yaml after a pre-release is
# published, passing the CALLBACK_* pipeline parameters below.
version: 2.1

parameters:
  # Set by trigger-circleci-e2e.yaml's API trigger; read back by the release
  # automation via CircleCI's pipeline values API. Empty defaults let the
  # pipeline be re-run manually without firing a spurious callback.
  CALLBACK_PRODUCT_REPO:
    type: string
    default: ""
  CALLBACK_RC_TAG:
    type: string
    default: ""

jobs:
  # Stand-in for the setup-stage `passthrough` job. Intentionally trivial and
  # does NOT checkout — it exists only so its workflow completes and fires a
  # workflow-completed webhook the automation must IGNORE (proving the dedup).
  passthrough:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Setup-stage placeholder (no-op)
          command: |
            echo "sandbox passthrough: setup-stage stand-in, nothing to do"

  fake-e2e:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Simulated e2e test (always passes)
          command: |
            echo "sandbox e2e: pretending to test << pipeline.parameters.CALLBACK_PRODUCT_REPO >> at << pipeline.parameters.CALLBACK_RC_TAG >>"

workflows:
  # Setup-stage stand-in. Named `passthrough` to mirror the real e2e project's
  # setup workflow — the automation SKIPS this name, so its completion must NOT
  # trigger a GA.
  passthrough:
    jobs:
      # tags are opt-in: circleci runs no workflow for a tag-triggered pipeline
      # unless the jobs carry tag filters, which otherwise shows up as a
      # pipeline stuck at "created" with no workflow.
      - passthrough:
          filters:
            tags:
              only: /^v.*/

  # Named suite workflow (mirrors k8s-inventory / ecs-inventory). The automation
  # acts on THIS workflow's completion to dispatch the GA.
  fake-e2e:
    jobs:
      - fake-e2e:
          filters:
            tags:
              only: /^v.*/
