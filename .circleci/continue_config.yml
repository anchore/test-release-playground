# Continuation pipeline for the sandbox e2e loop — the "named suite" half of the
# setup + continuation split (mirrors the real e2e project, where the setup
# `passthrough` workflow continues into suites like `k8s-inventory`).
#
# Its `fake-e2e` workflow stands in for a product suite. Because its name is NOT
# a setup-stage name, this workflow's native workflow-completed webhook is the
# one the release automation acts on to dispatch the GA — exactly once per
# pipeline, even though the `passthrough` setup workflow also completes.
version: 2.1

parameters:
  # Mirrored from the setup config (config.yml) so the API-supplied values
  # propagate into the continuation. Must be declared here too, or the
  # continuation would drop them.
  CALLBACK_PRODUCT_REPO:
    type: string
    default: ""
  CALLBACK_RC_TAG:
    type: string
    default: ""

jobs:
  fake-e2e:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Simulated e2e test (always passes)
          command: |
            echo "sandbox e2e: pretending to test << pipeline.parameters.CALLBACK_PRODUCT_REPO >> at << pipeline.parameters.CALLBACK_RC_TAG >>"

  # LEGACY (kept for reference) — the sandbox originally POSTed its own signed
  # HMAC callback from this job. It now uses CircleCI's NATIVE workflow-completed
  # outbound webhook instead (same mechanism as production; configured in the
  # CircleCI project settings, not here), so this job stays commented out.
  # notify-release-automation:
  #   docker:
  #     - image: cimg/base:stable
  #   resource_class: small
  #   circleci_ip_ranges: true
  #   steps:
  #     - run:
  #         name: Skip when no callback configured
  #         command: |
  #           CALLBACK_PRODUCT_REPO="<< pipeline.parameters.CALLBACK_PRODUCT_REPO >>"
  #           CALLBACK_RC_TAG="<< pipeline.parameters.CALLBACK_RC_TAG >>"
  #           if [ -z "$CALLBACK_PRODUCT_REPO" ] || [ -z "$CALLBACK_RC_TAG" ]; then
  #             echo "CALLBACK_PRODUCT_REPO or CALLBACK_RC_TAG unset — skipping (manual re-run)."
  #             circleci-agent step halt
  #           fi
  #     - run:
  #         name: POST signed success callback
  #         command: |
  #           set -eu
  #           : "${RELEASE_CALLBACK_URL:?context var not set}"
  #           : "${RELEASE_CALLBACK_SECRET:?context var not set}"
  #           CALLBACK_PRODUCT_REPO="<< pipeline.parameters.CALLBACK_PRODUCT_REPO >>"
  #           CALLBACK_RC_TAG="<< pipeline.parameters.CALLBACK_RC_TAG >>"
  #           WORKFLOW_URL="https://app.circleci.com/pipelines/workflows/${CIRCLE_WORKFLOW_ID}"
  #           BODY=$(jq -cn \
  #             --arg r "$CALLBACK_PRODUCT_REPO" \
  #             --arg t "$CALLBACK_RC_TAG" \
  #             --arg u "$WORKFLOW_URL" \
  #             '{product_repo:$r, rc_tag:$t, status:"success", workflow_url:$u}')
  #           SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$RELEASE_CALLBACK_SECRET" | awk '{print $2}')
  #           curl -fsS -X POST "$RELEASE_CALLBACK_URL" \
  #             -H "content-type: application/json" \
  #             -H "circleci-signature: v1=${SIG}" \
  #             --data "$BODY"

workflows:
  # Named suite workflow (mirrors `k8s-inventory` / `ecs-inventory`). NOT a
  # setup-stage name, so the release automation acts on ITS completion to
  # dispatch the GA.
  fake-e2e:
    jobs:
      # tag filters required here too — the continuation runs in the same
      # tag-triggered pipeline.
      - fake-e2e:
          filters:
            tags:
              only: /^v.*/
