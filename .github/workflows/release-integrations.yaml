# Dummy tagger for the release-pipeline sandbox loop. Handles both RC and GA
# versions — the version string decides which.
#
# What this exercises end-to-end:
#   1. Job pins to a gated `environment`. GitHub parks the deployment and sends
#      deployment_protection_rule.requested to the release automation.
#   2. The automation evaluates policy, mints a contents:write token scoped to
#      this repo, writes it as the TAG_TOKEN env secret, and approves the
#      gate. The job then unblocks.
#   3. This workflow pushes the tag using TAG_TOKEN and publishes a GitHub
#      Release for it. An RC is cut from the triggering ref (main HEAD); a GA is
#      cut from the SAME commit as the latest RC of that version — the commit
#      e2e actually validated — not from a possibly-advanced main. Publishing
#      fires release.published, which downstream automation reacts to.
#
# Kept intentionally minimal — no build, no assets, no notes. Just enough to
# prove the token flow and the release event.

name: Release Integrations

permissions: {}

concurrency:
  group: release-integrations
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: version to release, RC or GA (e.g. 1.2.3 or 1.2.3-rc1 — v prefix optional)
        required: true

jobs:
  tag:
    runs-on: ubuntu-24.04
    # each stage keeps its own gated env so the automation can apply different
    # policy to an RC than to a GA.
    environment: ${{ contains(inputs.version, '-rc') && 'rc-release' || 'ga-release' }}
    # No workflow-level GITHUB_TOKEN scopes granted. All privileged actions
    # (git push, release create) use the short-lived TAG_TOKEN minted by the
    # release automation.
    permissions: {}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify TAG_TOKEN was minted
        env:
          TAG_TOKEN: ${{ secrets.TAG_TOKEN }}
        run: |
          if [ -z "${TAG_TOKEN:-}" ]; then
            echo "TAG_TOKEN not set. The env gate should have written it as an env secret."
            exit 1
          fi
          echo "TAG_TOKEN present."

      - name: Push tag
        env:
          TAG_TOKEN: ${{ secrets.TAG_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          # tolerate both `1.2.3` and `v1.2.3` inputs
          TAG="v${VERSION#v}"

          case "$TAG" in
            *-rc*)
              # RC: cut from the currently checked-out ref (main HEAD).
              echo "tagging RC $TAG at HEAD"
              git tag "$TAG"
              ;;
            *)
              # GA: tag the SAME commit as the latest RC of this version. main may
              # have advanced since that RC was cut and e2e-tested, so the GA must
              # point at exactly the commit that was validated — not HEAD. checkout
              # uses fetch-depth: 0, so every RC tag + its commit is already local.
              # sort -V orders rc2 < rc10 correctly; the glob won't match other
              # versions (e.g. v1.2.30-rc1) since the next char after $TAG is '-'.
              LATEST_RC=$(git tag -l "${TAG}-rc*" | sort -V | tail -n1)
              if [ -z "$LATEST_RC" ]; then
                echo "no ${TAG}-rcN tag found; refusing to cut GA from an untested commit" >&2
                exit 1
              fi
              RC_SHA=$(git rev-list -n1 "$LATEST_RC")
              echo "tagging GA $TAG at $LATEST_RC ($RC_SHA)"
              git tag "$TAG" "$RC_SHA"
              ;;
          esac

          echo "pushing $TAG"
          # github's git endpoint rejects `bearer` headers. a credential helper
          # feeds the token to git over a pipe instead — note the single quotes:
          # git stores the literal `$TAG_TOKEN`, and the helper's own shell
          # expands it from the env at push time, so the value never lands in
          # argv or in .git/config.
          git -c credential.helper= \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$TAG_TOKEN"; }; f' \
              push origin "$TAG"

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          # gh CLI reads GH_TOKEN for `gh release create`. contents:write is
          # the permission releases live under — there is no separate release
          # permission. the tag already exists at this point, so gh creates no
          # ref and the workflows:write rule for ref-creating releases is moot.
          GH_TOKEN: ${{ secrets.TAG_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # empty release — the published event is the point, not the content.
          # RCs are marked prerelease so they don't move the `latest` pointer.
          case "$TAG" in
            *-rc*) PRERELEASE=--prerelease ;;
            *)     PRERELEASE= ;;
          esac
          gh release create "$TAG" --title "$TAG" --notes "" ${PRERELEASE}
