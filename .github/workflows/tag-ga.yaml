# Dummy GA tagger for the release-pipeline sandbox loop.
#
# Dispatched by the release automation on a successful e2e callback. Inputs
# (`rc_tag`, `version`) are exactly what its dispatch sends.
#
# What this exercises:
#   1. Job pins to `environment: ga-release`. Same gate → provision flow as
#      tag-rc.yaml, just against the second env with its own per-stage
#      workflow-path / trigger-event policy.
#   2. Tags the same commit the RC tag points at and publishes a GitHub
#      Release. Publishing the Release fires release.published, which the
#      automation's GA handler reacts to by dispatching helm-pr.yaml and
#      docs-pr.yaml on this same repo (all downstream repos collapse onto
#      this sandbox).

name: tag-ga

permissions: {}

concurrency:
  group: tag-ga
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: The RC tag whose commit to promote (e.g. v1.2.3-rc1)
        required: true
      version:
        description: GA version (e.g. 1.2.3 — no v prefix)
        required: true

jobs:
  tag:
    runs-on: ubuntu-24.04
    environment: ga-release
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Promote the exact commit the RC tag points at.
          ref: ${{ inputs.rc_tag }}
          persist-credentials: false

      - name: Verify TAG_TOKEN was minted
        env:
          TAG_TOKEN: ${{ secrets.TAG_TOKEN }}
        run: |
          if [ -z "${TAG_TOKEN:-}" ]; then
            echo "TAG_TOKEN not set. The ga-release env gate should have written it as an env secret."
            exit 1
          fi
          echo "TAG_TOKEN present."

      - name: Push GA tag and publish Release
        env:
          # gh CLI reads GH_TOKEN for `gh release create`.
          GH_TOKEN: ${{ secrets.TAG_TOKEN }}
          TAG_TOKEN: ${{ secrets.TAG_TOKEN }}
          VERSION: ${{ inputs.version }}
          RC_TAG: ${{ inputs.rc_tag }}
        run: |
          set -eu
          GA_TAG="v${VERSION}"
          echo "tagging same commit as ${RC_TAG} → ${GA_TAG}"
          git tag "$GA_TAG"
          git -c http.extraheader="AUTHORIZATION: bearer ${TAG_TOKEN}" \
            push origin "$GA_TAG"

          # Publishing the Release is what fires release.published, which the
          # automation's GA handler consumes to dispatch helm-pr + docs-pr.
          gh release create "$GA_TAG" \
            --title "$GA_TAG" \
            --notes "sandbox GA promotion of ${RC_TAG}"

      - name: Self-revoke TAG_TOKEN
        if: always()
        env:
          TAG_TOKEN: ${{ secrets.TAG_TOKEN }}
        run: |
          curl -fsS -X DELETE \
            -H "Authorization: Bearer ${TAG_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/installation/token || true
