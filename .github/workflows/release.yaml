name: "Release"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: tag the latest commit on main with the given version (prefixed with v)
        required: true
      skip-checks:
        description: skip the check gate that verifies required checks have passed on main
        type: boolean
        default: false

run-name: ${{ github.event.inputs.version }}

jobs:
  version-available:
    permissions:
      contents: read # required for the reusable workflow to check out the repo and verify the version
    uses: anchore/workflows/.github/workflows/check-version-available.yaml@b0c30a80409130d329aaa356fd64a34d8c0b3375 # v0.7.2
    with:
      version: ${{ github.event.inputs.version }}

  check-gate:
    # only run the gate when checks have not been explicitly skipped
    if: ${{ !inputs.skip-checks }}
    permissions:
      checks: read # required for getting the status of specific check names
      contents: read # required for the reusable workflow to check out the repo and verify the version
    uses: anchore/workflows/.github/workflows/check-gate.yaml@7212994dc8fc3a53fe9c8e766ab5b4ddd16ea3d4 # v0.8.0
    with:
      # these are checks that should be run on pull-request and merges to main.
      # we do NOT want to kick off a release if these have not been verified on main.
      # Please see the validations.yaml workflow for the names that should be used here.
      checks: '["Build snapshot artifacts", "Static analysis", "Unit tests"]'

  release:
    needs:
      - check-gate
      - version-available
    # run even when check-gate is skipped, but never when version-available
    # failed/was skipped, nor when check-gate failed or was cancelled. note:
    # always() disables the implicit success() gate on ALL needs, so the
    # version-available requirement must be re-asserted explicitly here.
    if: >-
      ${{ always()
          && needs.version-available.result == 'success'
          && !contains(fromJSON('["failure", "cancelled"]'), needs.check-gate.result) }}
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required for creating the GitHub release and pushing the version tag
      packages: write # required for publishing release artifacts to GitHub packages
      issues: read # chronicle reads referenced issues for the changelog
      pull-requests: read # chronicle reads referenced PRs for the changelog
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bootstrap environment
        uses: anchore/go-make/.github/actions/setup@39fe5f71112d4dceb3ff0a92a40f272f067fc457 # v0.6.0

      - name: Build & publish release artifacts
        run: make ci-release
        env:
          TAG_TOKEN: ${{ secrets.TAG_TOKEN }} # for pushing tags (does not inherit workflow permissions)
          RELEASE_VERSION: ${{ github.event.inputs.version }} # the eventual tag
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for creating the github release (requires write access to packages and content)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: artifacts
          path: dist/**/*
